name: deploy theme & CDN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Modular Theme
        run: python build.py

      - name: Validate Integrity
        run: python build.py --check

  deploy-pages:
    name: Deploy to GitHub Pages (Online CDN)
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Web Assets
        run: |
          mkdir -p _site
          cp RWX-Luna.css _site/
          cp RWX-Luna.theme.css _site/
          cp -r assets _site/ 2>/dev/null || true
          cp manifest.json _site/ 2>/dev/null || true
          cp README.md _site/index.md 2>/dev/null || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
