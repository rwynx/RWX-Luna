name: update classes

on:
  schedule:
    - cron: '0 */12 * * *' # 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-classes:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: update classes
        run: |
          python scripts/update-classes.py
          python build.py
          python build.py --check

      - name: commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: auto-update discord classes" && git push)
